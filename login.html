
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register - Green Garden</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">
            <h2 class="logo">Green Garden 🌿</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="indoor.html">Indoor Plants</a></li>
                <li><a href="outdoor.html">Outdoor Plants</a></li>
                <li><a href="flowers.html">Flowers</a></li>
                <li><a href="medicinal.html">Medicinal Plants</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="testimonials.html">Testimonials</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Login and Register Section -->
    <section class="login-section">

        <div class="login-container">

            <h1>Welcome to Green Garden 🌱</h1>
            <p class="login-subtitle">Grow your happiness with us!</p>

            <!-- Login Form -->
            <form onsubmit="return loginUser(event)">

                <h2>Login</h2>

                <label>Email Address</label>
                <input type="email" id="loginEmail"
                       placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" id="loginPassword"
                       placeholder="Enter your password" required>

                <button type="submit">Login</button>

            </form>

            <div class="form-divider">OR</div>

            <!-- Registration Form -->
            <form onsubmit="return registerUser(event)">

                <h2>Create Account</h2>

                <label>Full Name</label>
                <input type="text" id="regName"
                       placeholder="Enter your name" required>

                <label>Email Address</label>
                <input type="email" id="regEmail"
                       placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" id="regPassword"
                       placeholder="Create a password"
                       minlength="6" required>

                <button type="submit">Register</button>

            </form>

            <p id="loginMessage"></p>

        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Green Garden | Grow Green, Live Green 🌱</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
